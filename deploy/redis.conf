# P-ADE Redis 설정
# ─── 메모리 정책 ──────────────────────────────────────────────────────────────
maxmemory 2gb
maxmemory-policy allkeys-lru

# ─── 영속성 (RDB) ─────────────────────────────────────────────────────────────
# 15분 안에 1개 이상 변경 시 저장
save 900 1
# 5분 안에 10개 이상 변경 시 저장
save 300 10
# 1분 안에 10000개 이상 변경 시 저장
save 60 10000

# RDB 파일명 및 경로
dbfilename dump.rdb
dir /var/lib/redis

# RDB 저장 실패 시 쓰기 차단 (데이터 보호)
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# ─── 영속성 (AOF) ─────────────────────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
# everysec: 1초마다 fsync (성능과 안전성 균형)
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── 키 prefix 정책 ───────────────────────────────────────────────────────────
# pade:registry:* → 영구 보존 (중복 방지, TTL 없음)
# pade:cache:*    → TTL 6시간 (검색 결과 캐시)
# pade:queue:*    → 작업 큐
# pade:stats:*    → 실시간 통계

# ─── 연결 설정 ────────────────────────────────────────────────────────────────
bind 127.0.0.1
port 6379
timeout 0
tcp-keepalive 300
maxclients 1000

# ─── 성능 설정 ────────────────────────────────────────────────────────────────
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ─── 로깅 ────────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis-server.log

# ─── 보안 ────────────────────────────────────────────────────────────────────
protected-mode yes
# requirepass <password>  # 필요 시 활성화
